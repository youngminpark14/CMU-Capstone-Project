[project]
name = "prediction-market-forecasting-agent"
version = "0.1.0"
description = "An agent that forecasts Kalshi prediction markets and sizes positions on them, with code-enforced limits and human approval. Educational capstone project; mock funds only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Youngmin" }]
dependencies = [
  "pydantic>=2.12,<2.13",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langchain-anthropic>=1.7,<2",
  "chromadb>=1.5,<2",
  # The state server runs on either MCP SDK line; see docs/decisions/0003.
  "mcp>=1.30,<3",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "numpy>=2",
  "typer>=0.16",
  "rich>=13.9",
  "beautifulsoup4>=4.13",
  "lxml>=5.3",
  "matplotlib>=3.10",
  "tzdata",
]

[project.scripts]
pmfa = "pmfa.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-timeout>=2.3",
  "hypothesis>=6.150",
  "ruff>=0.17",
]
# CrewAI defines the four LLM roles. It pins the MCP SDK below 2, so it cannot
# share an environment with the `mcp2` group.
crewai = ["crewai>=1.15.45,<1.16"]
# The MCP SDK v2 line, without CrewAI: roles call the gateway directly.
mcp2 = ["mcp>=2.3,<3"]
notebook = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]

[tool.uv]
default-groups = ["dev", "crewai"]
conflicts = [[{ group = "crewai" }, { group = "mcp2" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmfa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
timeout = 120
markers = [
  "crewai: needs the crewai dependency group",
  "mcp2: needs the MCP SDK v2 line",
  "smoke: opt-in tests that call live services; never run in CI",
]
filterwarnings = ["ignore::DeprecationWarning:chromadb.*", "ignore::DeprecationWarning:crewai.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["pmfa"]
